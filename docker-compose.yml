version: "3"
services:
  mysql:
    image: mysql:8.0.41-debian
    container_name: mysql_inv
    hostname: mysql
    ports:
      - '3308:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root

  app:
    build: .
    image: inventory-management:v1
    ports:
      - "8888:8080"
    environment:
      DBMS_CONNECTION: jdbc:mysql://mysql:3306/inventory_management
    depends_on:
      - mysql
